<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f3efe6">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#141310">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="LoC">
<title>Library of College</title>
<meta name="description" content="Where the stories live until the essay needs them.">
<meta property="og:type" content="website">
<meta property="og:title" content="Library of College">
<meta property="og:description" content="Where the stories live until the essay needs them.">
<meta property="og:image" content="https://liboc.vercel.app/og-image.png">
<meta property="og:url" content="https://liboc.vercel.app">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Library of College">
<meta name="twitter:description" content="Where the stories live until the essay needs them.">
<meta name="twitter:image" content="https://liboc.vercel.app/og-image.png">
<style>
  :root{
    --bg:#faf8f3; --panel:#fffdf8; --ink:#221f1a; --muted:#756e64; --faint:#aca397;
    --line:#e6e0d4; --side:#f3efe6;
    --wash:rgba(34,31,26,.045); --washon:rgba(34,31,26,.09);
    --c0:#f3b97a; --c1:#ef9a9a; --c2:#b7d7a8; --c3:#a4c2ce;
    --c4:#c7b5d8; --c5:#e9d47f; --c6:#9dcfc3;
    --warn:#c2410c; --star:#c9922e;
    --tagbg:#eadfc6; --tagink:#6d5f42;
    --serif:ui-serif,"Iowan Old Style",Georgia,"Times New Roman",serif;
    --shadow:0 18px 50px rgba(30,25,15,.22);
    --lift:0 8px 28px rgba(30,25,15,.08);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191712; --panel:#211e18; --ink:#ede8dd; --muted:#a29a8b; --faint:#6f695e;
      --line:#322e26; --side:#141310;
      --wash:rgba(237,232,221,.05); --washon:rgba(237,232,221,.1);
      --warn:#fb923c; --star:#e0b34c;
      --tagbg:#35301f; --tagink:#c9b988;
      --shadow:0 18px 50px rgba(0,0,0,.5);
      --lift:0 8px 28px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  /* freeze the page while any overlay is open */
  html:has(.scrim.on,.palscrim.on){overflow:hidden}
  .scrim,.palscrim{overscroll-behavior:contain}
  ::selection{background:var(--tagbg);color:var(--ink)}
  :where(button,.navitem):focus-visible{outline:2px solid var(--muted);outline-offset:1px}
  button:active{transform:translateY(.5px)}
  :where(#nav,#palList,.tagsugs,.compose){scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  body{margin:0;background:var(--bg);color:var(--ink);
    font:15px/1.5 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;}

  button{font:inherit;cursor:pointer;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);border-radius:8px;padding:7px 12px;font-size:14px}
  button:hover{border-color:var(--muted)}
  .primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .primary:hover{opacity:.88}
  .ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .ghost:hover{color:var(--ink);border-color:var(--line)}
  .danger:hover{color:var(--warn)}
  .spacer{flex:1}
  .hint{color:var(--muted);font-size:12px}

  /* ---- layout ---- */
  .app{display:flex;min-height:100vh}
  .side{position:sticky;top:0;height:100vh;width:256px;flex:none;background:var(--side);
    border-right:1px solid var(--line);display:flex;flex-direction:column;padding:20px 14px 16px}
  .side-top{margin-bottom:18px}
  .brand{font-size:12.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--muted);padding:0 9px;margin-bottom:16px}
  .new{display:block;width:100%;background:var(--ink);color:var(--bg);border:1px solid var(--ink);
    border-radius:9px;padding:9px 12px;font-weight:600}
  .new:hover{opacity:.88;border-color:var(--ink)}

  #nav{display:flex;flex-direction:column;gap:2px;overflow-y:auto}
  .navgroup{font-size:10.5px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;
    color:var(--faint);padding:0 9px;margin:12px 0 4px}
  #nav > .navgroup:first-child{margin-top:0}
  .navsep{display:none}
  .navitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;
    border:none;border-radius:8px;padding:7px 9px;font-size:14px;color:var(--ink)}
  .navitem:hover{background:var(--wash);border:none}
  .navitem.on{background:var(--washon);font-weight:600}
  .cdot{flex:none;width:9px;height:9px;border-radius:50%}
  .cdot.tagdot{background:var(--tagbg);border:1.5px solid var(--tagink);width:8px;height:8px}
  .cdot.dump{background:none;width:9px;height:auto;border-radius:0;font-size:11px;
    line-height:1;color:var(--muted);text-align:center}
  .dumpnav{margin-bottom:6px}
  .dumpnav.on .cdot.dump{color:var(--ink)}
  .navlab{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .navn{margin-left:auto;color:var(--muted);font-size:12px;font-weight:400;padding-left:8px}
  .navn.thin{color:var(--warn);opacity:.85;font-weight:600}
  .thinnote{display:block;color:var(--warn);opacity:.8;font-size:12.5px;margin-top:3px}
  .piqguide{margin-top:12px;padding:12px 15px;border:1px solid var(--line);border-radius:10px;
    background:var(--panel);font-size:13px;line-height:1.65;color:var(--muted);max-width:60ch}
  .piqguide b{color:var(--ink)}
  .piqguide .q{display:block;font-family:var(--serif);font-style:italic;color:var(--ink);
    margin:7px 0 2px}
  .piqguide .rules{display:block;font-size:11px;font-weight:700;letter-spacing:.07em;
    text-transform:uppercase;color:var(--faint);margin-bottom:2px}
  .piqrow{border-top:1px solid var(--line);margin-top:9px;padding-top:8px}
  .piqrow .sch{display:block;font-size:12px;color:var(--faint);margin-top:1px}
  .piqrow:first-of-type{border-top:none;margin-top:4px;padding-top:0}
  .piqacts{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:5px;font-size:12.5px}
  .piqtip{margin-top:11px;border-top:1px solid var(--line);padding-top:9px}
  .navitem.on .cdot.dump{color:var(--ink)}
  .pagenav{margin-bottom:6px}
  .trashnav{margin-top:12px}

  .side-foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;
    display:flex;flex-direction:column;gap:10px}
  .search{width:100%;font:inherit;font-size:13.5px;padding:7px 10px;border:1px solid var(--line);
    border-radius:8px;background:var(--panel);color:var(--ink)}
  .search:focus{outline:2px solid var(--muted);outline-offset:-1px}
  .tools{display:flex;gap:2px;align-items:center}
  .tools .ghost{padding:4px 9px;font-size:13px}
  #signout{color:var(--faint)}
  #signout:hover{color:var(--ink)}
  .expmenu{display:flex;flex-direction:column;gap:1px;margin-top:-6px}
  .expmenu[hidden]{display:none}
  .expmenu .ghost{text-align:left;padding:4px 9px;font-size:13px}
  .backup{font-size:12px;color:var(--muted);padding:0 9px}
  .backup.warn{color:var(--warn);font-weight:600}
  #kbhint{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default;
    padding:0 9px;margin-top:-3px;color:var(--faint)}
  .kbd{display:inline-block;border:1px solid var(--line);border-bottom-width:2px;
    border-radius:4px;padding:0 4.5px;font-size:10.5px;line-height:1.55;
    background:var(--panel);color:var(--muted)}

  .main{flex:1;min-width:0;display:flex;justify-content:center}
  .page{width:100%;max-width:660px;padding:44px 40px 120px}

  /* ---- view header ---- */
  #viewhead h2{font-family:var(--serif);font-size:26px;font-weight:600;letter-spacing:-.01em;
    line-height:1.35;margin:0 0 6px;text-wrap:balance}
  .ewc,.navn,#cwc,.palhint{font-variant-numeric:tabular-nums}
  .hl{background:linear-gradient(transparent 60%,var(--hc) 0);padding:0 3px;margin:0 -3px}
  @media (prefers-color-scheme: dark){
    .hl{background:linear-gradient(transparent calc(100% - 3px),var(--hc) 0)}
  }
  .sub2{color:var(--muted);font-size:13.5px;line-height:1.5;margin:0;max-width:52ch}
  .nowrap{white-space:nowrap}

  /* ---- entry rows ---- */
  #view{margin-top:14px}
  .entry{border-bottom:1px solid var(--line);margin:0 -10px}
  .entry:first-child{border-top:1px solid var(--line)}
  .entry:not(.open):hover{background:var(--wash)}
  .entry.sel{background:var(--wash)}
  .ehead{display:flex;gap:12px;align-items:flex-start;padding:14px 10px;cursor:pointer}
  .etext{min-width:0;flex:1}
  .entry h3{margin:0;font-size:15px;font-weight:600;line-height:1.4}
  .entry p.snip{margin:3px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .snip b{color:var(--ink);font-weight:600}
  .untitled{color:var(--muted);font-style:italic;font-weight:400}
  .dots{display:inline-flex;gap:4px;margin-left:8px;vertical-align:2px}
  .dot{flex:none;width:7px;height:7px;border-radius:50%}
  .ecats{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:11.5px;color:var(--muted)}
  .ecat{display:inline-flex;align-items:center;gap:5px}
  .ecat[data-cat]{cursor:pointer}
  .ecat[data-cat]:hover{color:var(--ink)}
  .ecat .dot{width:6px;height:6px}

  .eside{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:5px;margin-top:2px}
  .ectl{display:flex;gap:8px;align-items:center}
  .ewc{font-size:11px;color:var(--faint);white-space:nowrap}

  .star{width:17px;height:17px;line-height:17px;text-align:center;font-size:15px;
    color:var(--faint);cursor:pointer;user-select:none;opacity:.22;transition:.12s}
  .entry:hover .star,.star.on,.selecting .star{opacity:1}
  .star:hover{color:var(--star)}
  .star.on{color:var(--star)}

  .rowpick{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--faint);
    position:relative;opacity:.22;transition:.12s;cursor:pointer}
  .entry:hover .rowpick,.entry.sel .rowpick,.selecting .rowpick{opacity:1}
  .rowpick:hover{border-color:var(--ink)}
  .entry.sel .rowpick{background:var(--ink);border-color:var(--ink)}
  .entry.sel .rowpick::after{content:"";position:absolute;left:5px;top:1.5px;width:4px;height:8px;
    border:solid var(--bg);border-width:0 2px 2px 0;transform:rotate(45deg)}
  @media (hover:none){.rowpick,.star{opacity:.4}}

  /* ---- expanded in place ---- */
  .entry.open{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    margin:8px -18px;box-shadow:var(--lift)}
  .entry.open .ehead{padding:16px 18px 0}
  .entry.open h3{font-family:var(--serif);font-size:19px;line-height:1.35}
  .ebody{padding:0 18px 16px;cursor:auto;user-select:text}
  .ebody .meta{color:var(--muted);font-size:12.5px;margin:6px 0 12px}
  .ebody .usedin{margin:0 0 16px}
  .full{white-space:pre-wrap;font-family:var(--serif);font-size:16px;line-height:1.75;
    overflow-wrap:break-word}
  .eacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--line);
    margin-top:18px;padding-top:13px}
  .eacts button{font-size:13.5px;padding:6px 11px}
  .polished{margin-top:16px;border:1px dashed var(--line);border-radius:10px;
    padding:11px 14px 13px;background:var(--bg)}
  .pollab{display:flex;align-items:center;gap:10px;font-size:10.5px;font-weight:700;
    letter-spacing:.07em;text-transform:uppercase;color:var(--faint);margin-bottom:8px}
  .pollab .linkbtn{font-size:12px;font-weight:400;letter-spacing:0;text-transform:none}
  .polished .full{font-size:15px;line-height:1.7}

  /* ---- real-life tags ---- */
  .rtag{position:relative;display:inline-flex;align-items:center;gap:5px;
    font-size:11.5px;font-weight:600;color:var(--tagink);background:var(--tagbg);
    padding:3px 9px 3px 15px;
    clip-path:polygon(9px 0,100% 0,100% 100%,9px 100%,0 50%)}
  .rtag::before{content:"";position:absolute;left:5.5px;top:50%;transform:translateY(-50%);
    width:4.5px;height:4.5px;border-radius:50%;background:var(--panel)}
  .rtag[data-tag]{cursor:pointer}
  .rtag[data-tag]:hover{filter:brightness(.96)}
  .rtag.mini{font-size:10.5px;padding:2px 7px 2px 13px}
  .rtag.mini::before{background:var(--bg)}
  .rtag.htag{font-size:14px;font-weight:600;padding:5px 13px 5px 22px;vertical-align:3px;
    clip-path:polygon(12px 0,100% 0,100% 100%,12px 100%,0 50%)}
  .rtag.htag::before{left:7.5px;width:6px;height:6px;background:var(--bg)}
  .rowtags{display:flex;gap:6px;flex-wrap:wrap;margin-top:7px}
  .usedin{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .tagx{border:none;background:none;padding:0 0 0 2px;margin:0;color:inherit;opacity:.55;
    font-size:12px;line-height:1;cursor:pointer}
  .tagx:hover{opacity:1;border:none}
  .tagadd{border:1px dashed var(--line);background:none;color:var(--muted);font-size:11.5px;
    padding:2px 9px;border-radius:999px}
  .tagadd:hover{color:var(--ink);border-color:var(--muted);background:none}
  .tagedit{position:relative;display:inline-flex}
  .taginput{font:inherit;font-size:12.5px;padding:3px 8px;border:1px solid var(--line);
    border-radius:7px;background:var(--bg);color:var(--ink);width:170px}
  .taginput:focus{outline:2px solid var(--muted);outline-offset:-1px}
  .tagsugs{position:absolute;top:calc(100% + 4px);left:0;min-width:170px;max-height:180px;
    overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:9px;
    box-shadow:var(--shadow);padding:4px;display:flex;flex-direction:column;z-index:5}
  .tagsug{text-align:left;border:none;background:none;padding:5px 8px;border-radius:6px;
    font-size:13px;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .tagsug:hover{background:var(--wash);border:none}
  .tagsug[data-create]{color:var(--muted);font-style:italic}

  .quickadd{width:100%;font:inherit;font-size:14px;line-height:1.55;padding:9px 12px;
    margin-top:16px;border:1px dashed var(--line);border-radius:9px;background:transparent;
    color:var(--ink);resize:none;overflow:hidden;display:block}
  .quickadd:hover{border-color:var(--faint)}
  .quickadd::placeholder{color:var(--faint)}
  .quickadd:focus{outline:none;border-color:var(--muted);border-style:solid;background:var(--panel)}

  .empty{color:var(--muted);font-size:14.5px;line-height:1.65;margin-top:22px;max-width:44ch}
  .linkbtn{border:none;background:none;padding:0;color:var(--ink);text-decoration:underline;
    text-underline-offset:2px;font:inherit;cursor:pointer}
  .linkbtn:hover{border:none;color:var(--muted)}

  /* ---- Essays page: prompt rows reuse the entry row + expand-in-place ---- */
  .padd{margin:0 0 14px;text-align:left;color:var(--faint);cursor:pointer}
  .padd:hover{color:var(--ink)}
  .pform{display:flex;flex-direction:column;gap:8px;margin:0 0 14px;padding:12px 14px;
    border:1px solid var(--line);border-radius:10px;background:var(--panel)}
  .ebody .pform{margin:0;padding:0;border:none;background:none}
  .pinput{font:inherit;font-size:13.5px;padding:6px 9px;border:1px solid var(--line);border-radius:7px;
    background:var(--bg);color:var(--ink);width:100%;min-width:0}
  .pinput:focus{outline:2px solid var(--muted);outline-offset:-1px}
  textarea.pinput{resize:vertical;line-height:1.55}
  /* native date/number parts (calendar icon, spinners, picker) follow the theme */
  @media (prefers-color-scheme: dark){ .pinput{color-scheme:dark} }
  .pformrow{display:grid;grid-template-columns:1fr auto 110px;gap:8px;align-items:end}
  .pformacts{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
  .pformacts .primary{font-size:13px;padding:5px 12px}
  .pf{display:flex;flex-direction:column;gap:4px;min-width:0}
  .pf .chiplab{margin:0}
  .pfields{display:flex;gap:16px;flex-wrap:wrap;align-items:flex-end;margin-top:16px}
  .pfields .pinput{width:auto}
  .pfields input[type=number]{width:96px}
  .pstat{font:700 10.5px/1 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;letter-spacing:.07em;
    text-transform:uppercase;color:var(--faint);vertical-align:2px;margin-left:6px;white-space:nowrap}
  .pstat.drafting{color:var(--star)}
  .pstat.done{color:var(--muted)}
  .prow.done:not(.open){opacity:.6}
  .pdays{font-size:11px;color:var(--faint);white-space:nowrap;font-variant-numeric:tabular-nums}
  .pdays.soon{color:var(--warn);font-weight:600}
  .chip.pstatbtn.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
  .ppicks{display:flex;flex-direction:column;margin-top:4px}
  .ppick{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid var(--line)}
  .ppickmain{flex:1;min-width:0}
  .ptitle{font-weight:600;text-decoration:none;text-align:left}
  .ptitle:hover{text-decoration:underline}
  .ppick .ewc{margin-left:8px}
  .ppick .snip{margin:2px 0 0;font-size:13px;line-height:1.5;color:var(--muted);
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .ppicks .tagadd{align-self:flex-start;margin-top:10px}
  .picker{display:flex;flex-direction:column;gap:6px;margin-top:10px}
  .pickres{display:flex;flex-direction:column;max-height:280px;overflow-y:auto;border:1px solid var(--line);
    border-radius:9px;padding:4px;background:var(--bg);scrollbar-width:thin;scrollbar-color:var(--line) transparent}
  .pickopt{display:flex;align-items:center;gap:9px;text-align:left;border:none;background:none;
    border-radius:6px;padding:6px 8px;width:100%}
  .pickopt:hover{background:var(--wash);border:none}
  .pcheck{flex:none;width:16px;text-align:center;color:var(--faint);font-weight:700}
  .pickopt.on .pcheck{color:var(--ink)}
  .pickmain{flex:1;min-width:0;display:flex;flex-direction:column}
  .pickt{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .picks{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pickempty{padding:8px}
  .trow .eside .ghost{font-size:13px;padding:4px 10px}
  .mpick{font-size:12px;margin-left:10px;white-space:nowrap}

  /* ---- memory joggers (empty states) ---- */
  .jogs{display:flex;flex-direction:column;align-items:flex-start;gap:6px;margin-top:12px}
  .jog{border:1px dashed var(--line);background:none;color:var(--muted);font-family:var(--serif);
    font-style:italic;font-size:14.5px;text-align:left;border-radius:9px;padding:6px 12px}
  .jog:hover{color:var(--ink);border-color:var(--muted)}

  /* ---- web clipper bookmarklet ---- */
  .bml{display:inline-block;margin-left:4px;padding:1px 10px;border:1px solid var(--line);border-radius:999px;
    background:var(--bg);color:var(--ink);font-weight:600;font-style:normal;text-decoration:none;cursor:grab}
  .bml:hover{border-color:var(--muted)}

  /* ---- composer: slide-over from the right ---- */
  .scrim{position:fixed;inset:0;background:rgba(24,20,14,.45);display:none;z-index:20;
    backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .scrim.on{display:flex}
  #composer{justify-content:flex-end;align-items:stretch}
  .compose{background:var(--panel);border-left:1px solid var(--line);width:100%;max-width:480px;
    height:100%;overflow:auto;padding:26px 30px 20px;box-shadow:var(--shadow);
    display:flex;flex-direction:column}
  .scrim.on .compose{animation:slidein .2s ease}
  @keyframes slidein{from{transform:translateX(48px);opacity:.4}}
  @media (prefers-reduced-motion: reduce){
    .scrim.on .compose,.palscrim.on .pal{animation:none}
    .star,.rowpick,.toast{transition:none}
  }
  .compose #title{border:none;border-bottom:1px solid var(--line);background:transparent;
    width:100%;font-family:var(--serif);
    font-size:21px;font-weight:600;padding:2px 0 10px;color:var(--ink);outline:none}
  .compose #body{border:none;background:transparent;width:100%;flex:1;min-height:120px;

<script>
const CATEGORIES = ["Community/Perspective","Leadership","Why School","Why Major",

  "Something you made, built, or invented — creative in any form, not just art.",

];
const PIQS = {
  1:"Describe an example of your leadership experience in which you have positively influenced others, helped resolve disputes, or contributed to group efforts over time.",
  2:"Every person has a creative side, and it can be expressed in many ways: problem solving, original and innovative thinking, and artistically, to name a few. Describe how you express your creative side.",
  3:"What would you say is your greatest talent or skill? How have you developed and demonstrated that talent over time?",
  4:"Describe how you have taken advantage of a significant educational opportunity or worked to overcome an educational barrier you have faced.",
  5:"Describe the most significant challenge you have faced and the steps you have taken to overcome this challenge. How has this challenge affected your academic achievement?",
  6:"Think about an academic subject that inspires you. Describe how you have furthered this interest inside and/or outside of the classroom.",

  8:"Beyond what has already been shared in your application, what do you believe makes you a strong candidate for admissions to the University of California?"

const PIQ_MAP = [[7,8],[1],[],[6],[2,3],[5,4],[6]]; // PIQs each category feeds
const PIQ_TIPS = [
  "PIQ 7 wants impact you can point at; PIQ 8 is the wildcard for identity and perspective stories that fit nowhere else.",
  "Titles optional — sustained effort and visible change count more than the org chart.",
  "UC never asks “why this school” — shelve these entries for Common App supplementals instead.",
  "No “why major” PIQ exists — PIQ 6 is the closest cousin, and UC weighs major preparation for selective majors.",
  "UC defines creative broadly — an app or a club curriculum counts. If it’s your strongest card, PIQ 3 may be its home.",
  "Show the steps, not the drama — and answer PIQ 5’s academic-impact question in a sentence.",
  "Feed-the-interest actions are the whole answer: projects, certifications, rabbit holes — inside and outside class."
];
function piqTagCount(n){
  return state.entries.filter(e => (e.tags || []).some(t => t.toLowerCase() === "piq " + n)).length;
}
function piqGuideHTML(i){
  const planned = new Set();
  state.entries.forEach(e => (e.tags || []).forEach(t => {
    const m = t.match(/^piq ([1-8])$/i); if(m) planned.add(+m[1]);
  }));
  const status = !planned.size ? "none planned yet"
    : planned.size <= 4 ? `${planned.size} of 4 planned` : `${planned.size} planned — UC takes only 4`;
  const rows = PIQ_MAP[i].map(n => {
    const k = piqTagCount(n);
    return `<div class="piqrow"><span class="q">PIQ ${n} — “${PIQS[n]}”</span>
      <div class="piqacts">
        <button class="linkbtn" data-piqmatch="${n}">⌕ find evidence</button>
        ${k ? `<span class="rtag mini" data-tag="PIQ ${n}" title="See everything picked for PIQ ${n}">PIQ ${n} · ${k} picked</span>`
            : `<span class="hint">none picked yet</span>`}
      </div></div>`;
  }).join("");
  return `<span class="rules">UC PIQs · answer any 4 of 8 · 350 words each · ${status}</span>${rows}
    <div class="piqtip">${PIQ_TIPS[i]}</div>`;
}
// ---- Essays: the prompts you're answering ----
// Synced with the library. Each prompt: {id, q, sch, due: "YYYY-MM-DD" | "",
// limit: words | 0, status: "todo" | "drafting" | "done", picks: [entry ids],
// createdAt, updatedAt}. Prompts saved before the Essays page carry only
// {id, q, sch, createdAt}; every reader below copes with the missing fields.
const mapPrompts = () => state.prompts || [];
const promptById = id => mapPrompts().find(p => p.id === id);
// Used-in tag for a prompt: the first school named on it ("UC · MIT" → "UC").
const schTag = sch => (sch || "").split(/[·,]/)[0].trim();
const STATUS = { todo: "To do", drafting: "Drafting", done: "Done" };
const DAY = 86400000;
const dueDate = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
function daysLeft(s){ const t = new Date(); t.setHours(0, 0, 0, 0); return Math.round((dueDate(s) - t) / DAY); }
const fmtDue = s => dueDate(s).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const fmtDueLong = s => dueDate(s).toLocaleDateString(undefined,
  { weekday: "short", month: "short", day: "numeric", year: "numeric" });
const daysPhrase = d => d < 0 ? `${-d} day${d === -1 ? "" : "s"} overdue`
  : d === 0 ? "due today" : d === 1 ? "due tomorrow" : `${d} days left`;
const shortDays = d => d < 0 ? `${-d}d late` : d === 0 ? "today" : `${d}d`;
const validDue = v => /^\d{4}-\d{2}-\d{2}$/.test(v || "") ? v : "";
const promptPicks = p => (p.picks || []).map(byId).filter(Boolean);
// Open prompts with a deadline first (soonest on top), then undated, then done.
function sortedPrompts(){
  const rank = p => p.status === "done" ? 2 : p.due ? 0 : 1;
  return [...mapPrompts()].sort((a, b) => rank(a) - rank(b)
    || (rank(a) === 0 ? a.due.localeCompare(b.due) : 0)
    || (b.createdAt || 0) - (a.createdAt || 0));

// Delete = move to Recently deleted + leave a tombstone, so every device drops
// it and a stale copy can't bring it back. Returns the records, for Undo.
function trashEntries(ids){
  const out = [];
  for(const id of ids){
    const i = state.entries.findIndex(x => x.id === id);
    if(i < 0) continue;
    const [en] = state.entries.splice(i, 1);
    const rec = { ...en, deletedAt: Math.max(Date.now(), (en.updatedAt || 0) + 1) };
    state.trash = [rec, ...state.trash.filter(t => t.id !== id)];
    state.deleted[id] = rec.deletedAt;
    selected.delete(id); polished.delete(id);
    if(expanded === id) expanded = null;
    out.push(rec);
  }
  return out;
}
// "Delete forever": move the tombstone past the trash copy's deletedAt, so
// every device's copy of it drops out of Recently deleted on the next merge.
function purgeMark(rec){
  state.deleted[rec.id] = Math.max(Date.now(), (rec.deletedAt || 0) + 1);
}
function restoreEntries(recs){
  for(const { deletedAt, ...en } of recs){
    state.trash = state.trash.filter(t => t.id !== en.id);
    delete state.deleted[en.id];
    if(byId(en.id)) continue;
    en.updatedAt = Math.max(Date.now(), (deletedAt || 0) + 1); // outrank the tombstone elsewhere
    const at = state.entries.findIndex(x => x.createdAt < en.createdAt);
    state.entries.splice(at < 0 ? state.entries.length : at, 0, en);
  }
}

function blankState(){ return { entries: [], prompts: [], trash: [], deleted: {}, rev: 0, backupRev: 0 }; }
// Any stored or served copy → the current shape. Older copies lack prompts,
// trash and tombstones; an item without an id would break merge-by-id.
function normalize(s){
  const { _dirty, ...rest } = s && typeof s === "object" ? s : {};
  const list = a => Array.isArray(a) ? a.filter(x => x && typeof x === "object" && x.id) : [];
  const d = rest.deleted;
  return { ...rest, entries: list(rest.entries), prompts: list(rest.prompts), trash: list(rest.trash),
    deleted: d && typeof d === "object" && !Array.isArray(d) ? { ...d } : {},
    rev: +rest.rev || 0, backupRev: +rest.backupRev || 0 };
}

      // from before it existed can't say what the server has seen, so boot()
      // falls back to the old rev comparison for that one load.
      baseKnown = "_dirty" in s; dirty = !!s._dirty;

const TRASH_DAYS = 30, TRASH_MAX = 100, TRASH_CHARS = 80000, TOMB_DAYS = 120;
function mergeStates(local, server){
  const deleted = {};
  for(const src of [server.deleted, local.deleted])
    for(const [id, t] of Object.entries(src || {})) deleted[id] = Math.max(deleted[id] || 0, +t || 0);
  const stamp = x => x.updatedAt || x.createdAt || 0;
  const union = (mine, theirs) => {
    const m = new Map(theirs.map(x => [x.id, x]));
    mine.forEach(x => { const o = m.get(x.id); if(!o || stamp(x) >= stamp(o)) m.set(x.id, x); });
    return [...m.values()].filter(x => !(deleted[x.id] >= stamp(x)));
  };
  const entries = union(local.entries, server.entries).sort((a, b) => b.createdAt - a.createdAt);
  const prompts = union(local.prompts, server.prompts);
  const live = new Set([...entries, ...prompts].map(x => x.id));
  live.forEach(id => delete deleted[id]); // brought back by a later edit or a restore
  // A trash copy is dropped once its entry is live again, or once it was
  // purged ("Delete forever" moves the tombstone past the copy's deletedAt).
  const trash = new Map();
  [...server.trash, ...local.trash].forEach(t => {
    if(live.has(t.id) || (deleted[t.id] || 0) > (t.deletedAt || 0)) return;
    const o = trash.get(t.id);
    if(!o || (t.deletedAt || 0) >= (o.deletedAt || 0)) trash.set(t.id, t);
  });
  return prune({ ...server, ...local, entries, prompts, deleted,
    trash: [...trash.values()].sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0)),
    rev: server.rev, backupRev: Math.max(local.backupRev, server.backupRev) });
}
// Keep the synced copy small (the server caps it at 350KB): trash by age,
// count and size; tombstones by age.
function prune(s){
  const now = Date.now();
  let t = s.trash.filter(x => now - (x.deletedAt || 0) < TRASH_DAYS * DAY).slice(0, TRASH_MAX);
  while(t.length && JSON.stringify(t).length > TRASH_CHARS) t = t.slice(0, -1);
  s.trash = t;
  for(const [id, at] of Object.entries(s.deleted)) if(now - at > TOMB_DAYS * DAY) delete s.deleted[id];
  return s;
}

function hideToast(){ const t=$("toast"); t.classList.remove("on"); t.style.pointerEvents=""; }
function toast(msg){ const t=$("toast"); t.style.pointerEvents=""; t.textContent=msg; t.classList.add("on"); clearTimeout(t._t); t._t=setTimeout(hideToast,1600); }
function toastAction(msg, label, fn){
  const t = $("toast");
  t.innerHTML = `${esc(msg)}<button class="tbtn" id="tact">${esc(label)}</button>`;
  t.style.pointerEvents = "auto";

function copy(text,msg){ navigator.clipboard.writeText(text).then(()=>toast(msg)).catch(()=>toast("Copy failed")); }
// Confirm in the button itself (flips to "✓ Copied"), not via toast.
function copyFlip(text, btn){
  if(!btn || !btn.isConnected) return copy(text, "Copied");
  navigator.clipboard.writeText(text).then(() => {
    const old = btn.textContent;
    btn.style.minWidth = btn.offsetWidth + "px"; // keep width while the label swaps
    btn.textContent = "✓ Copied";
    clearTimeout(btn._t);
    btn._t = setTimeout(() => {
      if(btn.isConnected){ btn.textContent = old; btn.style.minWidth = ""; }
    }, 1500);
  }).catch(() => toast("Copy failed"));
}
function allTags(){
  const seen = new Map();
  state.entries.forEach(e => (e.tags || []).forEach(t => {
    const k = t.toLowerCase(); if(!seen.has(k)) seen.set(k, t);
  }));
  return [...seen.values()].sort((a,b) => a.localeCompare(b));
}

async function api(method, path, body){
  // Serialize before the token await: the request must carry exactly the state
  // the caller saw, so an edit made meanwhile stays unconfirmed (and syncs next).
  const payload = body ? JSON.stringify(body) : undefined;
  const token = window.Clerk && window.Clerk.session
    ? await window.Clerk.session.getToken() : null;
  const r = await fetch(API + path, { method,
    headers: { "content-type": "application/json",
      ...(token ? { authorization: "Bearer " + token } : {}) },
    body: payload });
  if(r.status === 401){
    if(window.Clerk && window.Clerk.user){
      authBlocked = true;
      lockShow("");
      $("lockText").textContent = `Signed in as ${
        window.Clerk.user.primaryEmailAddress?.emailAddress || "an unrecognized account"
      } — this account isn’t allowed here.`;
      $("lockErr").innerHTML = `<button class="linkbtn" id="lockOut">Sign out and use another account</button>`;
      $("lockOut").onclick = async () => { await window.Clerk.signOut(); location.reload(); };
    } else {
      lockShow(""); $("lockText").textContent = "Redirecting to sign-in…";
      location.replace("/login");
    }
    throw new Error("auth");
  }
  const data = await r.json().catch(() => ({}));
  if(!r.ok){
    const err = new Error(data.error || "Request failed");
    err.status = r.status;
    throw err;
  }
  return data;
}

// ---- sync ----
// state.rev is the server revision this copy builds on, and `dirty` marks edits
// the server hasn't confirmed. Every PUT claims rev+1, so the server's "must be
// ahead" check turns away any device that hasn't seen the latest write; that
// device pulls, merges (mergeStates) and retries instead of overwriting it.
let pushT = null, syncState = "synced";
let authBlocked = false; // a 401 put the lock screen up — boot() must not drop it
let syncing = false, syncAgain = false, lastPull = 0;
function setSync(s){ syncState = s; renderStatus(); }
// One sync at a time; a request that arrives meanwhile runs once it's done.
async function runSync(job){
  if(syncing){ syncAgain = true; return; }
  syncing = true;
  try{ await job(); }
  finally{
    syncing = false;
    if(syncAgain){ syncAgain = false; if(dirty) push(); }
  }
}
function doPush(){
  pushT = null;
  if(dirty && !authBlocked) runSync(() => pushState());
}
function push(){
  clearTimeout(pushT);
  pushT = setTimeout(doPush, 600);
}
async function pullMerge(){
  state = mergeStates(state, normalize(await api("GET", "/entries")));
  baseKnown = true;
  store(); render();
}
// PUT this copy as rev+1. A 409 means another device wrote first (or the
// server's wipe guard tripped): pull, merge, try again — a few times at most.
async function pushState(msg){
  try{
    if(!baseKnown) await pullMerge(); // pre-flag cache: merge before claiming a rev
    for(let tries = 0; tries < 4; tries++){
      const seq = editSeq, rev = state.rev + 1;
      try{
        await api("PUT", "/entries", { ...state, rev });
        state.rev = rev;
        if(seq === editSeq) dirty = false;
        store(); setSync("synced");
        if(msg) toast(msg);
        return;
      }catch(e){
        if(e.status !== 409) throw e;
      }
      await pullMerge();
      msg = msg || "Merged changes from another device";
    }
    setSync("offline");
    toast("Couldn’t sync yet — changes are safe on this device");
  }catch(e){
    if(e.message === "auth") return;
    setSync("offline");
    toast(e.status === 413 ? "Library too big to sync — empty Recently deleted, then try again"
      : "Couldn’t sync — changes are safe on this device");
  }
}
// Back on the tab after a while: pick up edits made on another device. Skipped
// while anything local is pending, an overlay is open, or an inline editor that
// a re-render would drop is open (the tag editors; Essays inputs carry their
// text through render via data-keep).
const overlayOpen = () => composerOpen() || dumpOpen() || matchOpen() || palOpen();
async function pull(){
  if(syncing || dirty || !baseKnown || authBlocked || isLocked() || overlayOpen()
     || document.querySelector("#view .taginput, #viewhead input")) return;
  lastPull = Date.now();
  await runSync(async () => {
    try{
      const s = normalize(await api("GET", "/entries"));
      if(dirty || s.rev <= state.rev) return;
      state = s; store(); setSync("synced"); render();
    }catch(e){ /* offline — nothing to pick up */ }
  });
}
document.addEventListener("visibilitychange", () => {
  if(document.visibilityState === "hidden"){
    // Leaving the tab (switching apps on mobile, closing the window) shouldn't
    // strand an edit inside the debounce window — flush it right away.
    if(pushT){ clearTimeout(pushT); doPush(); }
  } else if(!isLocked()){
    if(dirty) push(); // retry anything stranded while offline
    else if(Date.now() - lastPull > 30000) pull();
  }
});
window.addEventListener("online", () => { if(dirty && !isLocked()) push(); });
function renderStatus(){
  const b = $("backup");
  if(!state.entries.length){ b.textContent = ""; b.classList.remove("warn"); return; }
  if(syncState === "offline"){
    b.textContent = "Offline — changes saved on this device";
    b.classList.add("warn");
  } else {
    const pending = state.rev - state.backupRev;
    b.textContent = "Synced to your account" + (pending >= 25 ? " · consider an export backup" : "");
    b.classList.remove("warn");
  }
}

async function boot(){
  await runSync(async () => {
    try{
      const s = normalize(await api("GET", "/entries"));
      lastPull = Date.now();
      // Edits this device never got confirmed (the tab closed inside the
      // debounce, or it was offline) — or, for a cache from before the dirty
      // flag, the old signal: a local rev ahead of the server's.
      const unsynced = baseKnown ? dirty : state.entries.length > 0 && state.rev > s.rev;
      if(unsynced){
        state = mergeStates(state, s);
        baseKnown = true; dirty = true;
        store(); render();
        await pushState("Recovered unsynced changes from this device");
      } else {
        state = s; baseKnown = true; dirty = false;
        store(); setSync("synced"); render();
      }
    }catch(e){
      if(e.message !== "auth"){ setSync("offline"); render(); toast("Offline — using local copy"); }
    }
  });
  if(!authBlocked) lockHide(); // cold start held the lock until this first sync
  if(pendingKey){
    const k = pendingKey; pendingKey = null;
    if(k === "d") openDump();
    else if(k === "n") openComposer();
    else if(k === "m") openMatch();
    else if(k === "/") $("search").focus();
  }
  if(!authBlocked) openClip();
}

function openComposer(entry, prefill){
  if(entry){
    editing = entry.id;
    $("title").value = entry.title; $("body").value = entry.body;
    picked = new Set(entry.cats);
    $("save").textContent = "Save changes";
  } else if(prefill){ // a web clip: never clobber an unsaved draft — join it
    editing = null;
    $("title").value = draft ? draft.title || prefill.title : prefill.title;
    $("body").value = draft ? [(draft.body || "").trim(), prefill.body].filter(Boolean).join("\n\n") : prefill.body;
    picked = new Set([...(draft?.picked || []), ...prefill.cats]);
    if(draft) toast("Clip added to your unsaved draft");
    $("save").textContent = "Add entry";
    captureDraft(); // a closed tab or stray click can't lose the clip now
  } else {
    editing = null;
    if(draft){
      $("title").value = draft.title; $("body").value = draft.body;
      picked = new Set(draft.picked);
      toast("Draft restored");
    } else {
      $("title").value = ""; $("body").value = "";
      picked = new Set(query || tagFilter || page ? [] : [nav]);
    }
    $("save").textContent = "Add entry";
  }
  syncChips();
  updateCwc();
  $("composer").classList.add("on");
  $("title").focus();
}

}

function saveEntry(){
  const title = $("title").value.trim(), body = $("body").value.trim();
  if(!title && !body) return;
  if(!picked.size){ toast("Pick at least one category"); return; }
  const cats = [...picked].sort((a,b)=>a-b);
  let undo = null;
  if(editing){
    const e = byId(editing);
    if(!e){ closeComposer(); toast("That entry no longer exists"); return; }
    const prev = { title: e.title, body: e.body, cats: [...e.cats], updatedAt: e.updatedAt };
    Object.assign(e, { title, body, cats, updatedAt: Date.now() });
    polished.delete(e.id); // body changed — any polish is stale
    undo = () => { Object.assign(e, prev); persist(); };
  } else {
    state.entries.unshift({ id: newId(), title, body, cats,
      pinned: false, tags: [], createdAt: Date.now(), updatedAt: Date.now() });
  }
  closeComposer();
  draft = null; stashDraft(); // saved — nothing left to restore
  persist();
  if(undo) toastAction("Saved changes", "Undo", undo);
}

function showTagInput(){
  const en = byId(expanded);
  const btn = $("view").querySelector(".entry.open .tagadd");
  if(!en || !btn) return;
  btn.outerHTML = `<span class="tagedit">
      <input class="taginput" placeholder="Essay or school…">
      <div class="tagsugs"></div>
    </span>`;
  const inp = $("view").querySelector(".taginput");
  const sug = $("view").querySelector(".tagsugs");
  const refresh = () => {
    const q = inp.value.trim().toLowerCase();
    const own = new Set((en.tags || []).map(t => t.toLowerCase()));
    curSugs = allTags().filter(t => !own.has(t.toLowerCase()) && (!q || t.toLowerCase().includes(q)));
    let html = curSugs.map((t,i) => `<button class="tagsug" data-sug="${i}">${esc(t)}</button>`).join("");
    if(q && !own.has(q) && !curSugs.some(t => t.toLowerCase() === q))
      html += `<button class="tagsug" data-create>Create “${esc(inp.value.trim())}”</button>`;
    sug.innerHTML = html;
    sug.style.display = html ? "" : "none";
  };
  refresh();
  inp.oninput = refresh;
  inp.onkeydown = ev => {
    if(ev.key === "Enter"){ ev.preventDefault(); addTag(inp.value); }
    else if(ev.key === "Escape"){ ev.stopPropagation(); render(); }
  };
  inp.focus();
}
function addTag(raw){
  const en = byId(expanded); const t = (raw || "").trim();
  if(!en || !t) return;
  const existing = allTags().find(x => x.toLowerCase() === t.toLowerCase());
  const val = existing || t;
  en.tags = en.tags || [];
  if(!en.tags.some(x => x.toLowerCase() === val.toLowerCase())){
    en.tags.push(val); en.updatedAt = Date.now(); persist();
  } else render();
}
function setTagFilter(name){

function palSnip(e, q){
  const body = e.body || "";
  const i = q ? body.toLowerCase().indexOf(q) : -1;
  if(i >= 0){
    const s = Math.max(0, i - 30);
    return (s ? "…" : "") + esc(body.slice(s, i))
      + "<b>" + esc(body.slice(i, i + q.length)) + "</b>"
      + esc(body.slice(i + q.length, i + q.length + 60));
  }
  return esc(body.slice(0, 90));
}
function palBuild(qr){
  const q = qr.trim().toLowerCase();
  const items = [], acts = [];
  if(!q || "new entry".includes(q))
    acts.push({ icon:`<span class="cdot" style="border:1.5px solid var(--muted)"></span>`,
      title:"New entry", hint:"action", run:() => openComposer() });
  if(!q || "quick dump".includes(q))
    acts.push({ icon:`<span class="cdot dump">✦</span>`,
      title:"Quick dump", hint:"action", run:() => openDump() });
  if(!q || "match a prompt".includes(q))
    acts.push({ icon:`<span class="cdot dump">⌕</span>`,
      title:"Match a prompt", hint:"action", run:() => openMatch() });
  CATEGORIES.forEach((c,i) => {
    if(!q || c.toLowerCase().includes(q))
      acts.push({ icon:`<span class="cdot" style="background:var(--c${i})"></span>`,
        title:c, hint:"category", run:() => goToCategory(i) });
  });
  allTags().forEach(t => {
    if(q && t.toLowerCase().includes(q))
      acts.push({ icon:`<span class="cdot" style="background:var(--tagbg)"></span>`,
        title:t, hint:"tag", run:() => setTagFilter(t) });
  });
  if(acts.length) items.push({sec:"Go to"}, ...acts);
  // Every query word must appear somewhere; words can be in any order or field.
  const words = q.split(/\s+/).filter(Boolean);
  const hits = q
    ? state.entries.map(e => {
        const title = e.title.toLowerCase(), bodyL = e.body.toLowerCase(),
          tags = (e.tags || []).join(" ").toLowerCase();
        let score = 0;
        for(const w of words){
          if(title.includes(w)) score += 3;
          else if(tags.includes(w)) score += 2;
          else if(bodyL.includes(w)) score += 1;
          else { score = 0; break; }
        }
        return {e, score};
      }).filter(x => x.score).sort((a,b) => b.score - a.score).map(x => x.e)
    : state.entries.slice(0, 6);
  if(hits.length) items.push({sec: q ? "Entries" : "Recent"}, ...hits.map(e => ({
    icon:`<span class="dots">${e.cats.slice(0, 3).map(c =>
      `<span class="dot" style="background:var(--c${c})"></span>`).join("")}</span>`,
    title: e.title || "Untitled",
    snip: palSnip(e, words.find(w => e.body.toLowerCase().includes(w)) || q),
    hint: `${wc(e.body)} w`,
    run: () => palGoEntry(e)
  })));
  return items;
}
function palGoEntry(e){
  if(!e.cats.includes(nav)) nav = e.cats.length ? e.cats[0] : 0;
  page = null; saveUI(); qraw = query = ""; $("search").value = ""; tagFilter = null;
  expanded = e.id; render();
  const row = $("view").querySelector(`[data-id="${esc(e.id)}"]`);
  if(row) row.scrollIntoView({block:"center"});
}
function palIdeaItems(){
  const q = $("palq").value.trim();
  if(palIdeaState === "loading") return { items: [], msg: "✦ GPT-6 Astra is searching the stacks…" };
  if(palIdeaState === "error") return { items: [], msg: "Search failed — press Enter to retry." };
  if(palIdeaHits.length){
    const label = palIdeaQ.length > 34 ? palIdeaQ.slice(0, 34) + "…" : palIdeaQ;
    return { items: [{sec:`Related to “${esc(label)}”`}, ...palIdeaHits.map(({en, why}) => ({
      icon:`<span class="dots">${en.cats.slice(0, 3).map(c =>
        `<span class="dot" style="background:var(--c${c})"></span>`).join("")}</span>`,
      title: en.title || "Untitled",
      snip: why ? "✦ " + esc(why) : esc(en.body.slice(0, 90)),
      hint: `${wc(en.body)} w`,
      run: () => palGoEntry(en)
    }))] };
  }
  if(!q) return { items: [], msg: "Type an idea — a theme, person, place — and press Enter." };
  if(q === palIdeaQ) return { items: [], msg: "Nothing in the stacks relates to that yet." };
  return { items: [], msg: "Press Enter to search related entries." };
}
function palRefresh(){
  let msg = "No matches.";
  if(palMode === "idea"){
    const r = palIdeaItems();
    palItems = r.items; msg = r.msg || msg;
  } else {
    palItems = palBuild($("palq").value);
  }
  const count = palItems.filter(x => !x.sec).length;
  if(palSel >= count) palSel = Math.max(0, count - 1);
  let idx = -1;
  $("palList").innerHTML = palItems.length
    ? palItems.map(x => x.sec
        ? `<div class="palsec">${x.sec}</div>`
        : (idx++, `<div class="palitem ${idx === palSel ? "on" : ""}" data-pi="${idx}">
            ${x.icon || ""}
            <span class="palmain"><span class="paltitle">${esc(x.title)}</span>${
              x.snip ? `<span class="palsnip">${x.snip}</span>` : ""}</span>
            <span class="palhint">${x.hint || ""}</span>
          </div>`)).join("")
    : `<div class="palempty">${msg}</div>`;
  const on = $("palList").querySelector(".palitem.on");
  if(on) on.scrollIntoView({block:"nearest"});
}
function palRun(i){
  const it = palItems.filter(x => !x.sec)[i]; if(!it) return;
  closePalette();

}
$("palq").oninput = () => { palSel = 0; palRefresh(); };
$("palq").onkeydown = e => {

  else if(e.key === "ArrowUp"){ e.preventDefault(); if(count){ palSel = (palSel - 1 + count) % count; palRefresh(); } }
  else if(e.key === "Tab"){ e.preventDefault(); setPalMode(palMode === "text" ? "idea" : "text"); }
  else if(e.key === "Enter"){
    e.preventDefault();
    if(palMode === "idea"){

      if(q && (q !== palIdeaQ || palIdeaState === "error")) return palIdeaRun();
    }
    palRun(palSel);
  }
};

// ---- keyboard ----
document.addEventListener("keydown", e => {
  if(isLocked()){
    if(!e.target.closest?.("input,textarea") && ["d","n","m","/"].includes(e.key.toLowerCase()))
      pendingKey = e.key.toLowerCase();
    return;
  }
  if((e.metaKey || e.ctrlKey) && (e.key === "k" || e.key === "K")){
    e.preventDefault();
    if(composerOpen()) return;
    palOpen() ? closePalette() : openPalette();
    return;
  }
  if(e.key === "Escape"){
    if(palOpen()) return closePalette();
    if(matchOpen()) return closeMatch();
    if(dumpOpen()) return closeDump();
    if(composerOpen()) return closeComposer();
    if(page === "essays" && addingPrompt){ addingPrompt = false; return render(); }
    if(page === "essays" && pickFor){ pickFor = null; return render(); }
    if(page === "essays" && promptEdit){ promptEdit = null; return render(); }
    if(expanded){ expanded = null; return render(); }
    if(tagFilter){ tagFilter = null; return render(); }
    if(unusedOnly){ unusedOnly = false; saveUI(); return render(); }
    if(e.target === $("search") && $("search").value){
      $("search").value = ""; qraw = query = ""; render(); $("search").blur();
    }
    return;
  }
  if((e.metaKey || e.ctrlKey) && e.key === "Enter"){ if(composerOpen()) saveEntry(); return; }
  if(e.target.closest?.("input,textarea")) return;
  if(e.key === "/"){ e.preventDefault(); $("search").focus(); }
  else if(e.key === "n" || e.key === "N"){ e.preventDefault(); openComposer(); }
  else if(e.key === "d" || e.key === "D"){ e.preventDefault(); openDump(); }
  else if(e.key === "m" || e.key === "M"){ e.preventDefault(); openMatch(); }
  else if(expanded && !e.metaKey && !e.ctrlKey && !e.altKey && "ecus".includes(e.key.toLowerCase())){
    const en = byId(expanded); if(!en) return;
    e.preventDefault();
    const k = e.key.toLowerCase();
    if(k === "e") openComposer(en);
    else if(k === "c") copyFlip(en.body, $("view").querySelector('.entry.open [data-act="copy"]'));
    else if(k === "u") showTagInput();
    else if(k === "s"){ en.pinned = !en.pinned; persist(); toast(en.pinned ? "Pinned" : "Unpinned"); }
  }
  else if(["ArrowDown","ArrowUp","j","k"].includes(e.key)){
    const rows = [...$("view").querySelectorAll(".entry")];
    if(!rows.length) return;
    e.preventDefault();
    const dir = (e.key === "ArrowDown" || e.key === "j") ? 1 : -1;
    const i = rows.findIndex(r => r.dataset.id === expanded);
    const next = i < 0 ? (dir > 0 ? 0 : rows.length - 1)
      : Math.min(rows.length - 1, Math.max(0, i + dir));
    if(i === next) return;
    expanded = rows[next].dataset.id;
    render();
    const row = $("view").querySelector(`[data-id="${expanded}"]`);
    if(row) row.scrollIntoView({block:"nearest"});
  }
});

// Both AI fills re-find their entry by id after the await: a sync may have
// swapped in a fresh copy of the library meanwhile.
async function genTitle(en){
  const id = en.id;
  pending.add(id); render();
  try{
    const r = await api("POST", "/title", { body: en.body });
    // fill in only if the entry still exists and wasn't titled by hand meanwhile
    const cur = byId(id);
    if(r.title && cur && !cur.title){
      cur.title = r.title; cur.updatedAt = Date.now(); persist();
    }
  }catch(e){ /* stays Untitled; user can Edit */ }
  finally{ pending.delete(id); render(); }
}
async function genClassify(orig){
  const id = orig.id;
  let en = orig;
  pending.add(id); render();
  try{
    const r = await api("POST", "/classify", { body: orig.body });
    en = byId(id); if(!en) return;
    if(r.title && !en.title) en.title = r.title;
    if(Array.isArray(r.cats) && !en.cats.length){
      const cats = [...new Set(r.cats.map(Number).filter(c => c >= 0 && c <= 6))]
        .sort((a,b) => a - b).slice(0, 3);
      if(cats.length) en.cats = cats;
    }
    if(!en.cats.length) en.cats = [0]; // never leave an entry invisible
    en.updatedAt = Date.now();
    persist();
    const where = en.cats.map(c => CATEGORIES[c]).join(" · ");
    toast(`Filed under ${where}`);
    if(dumpOpen()) dumpReceipt(`Filed <button data-goto="${esc(en.id)}">“${
      esc(en.title || "Untitled")}”</button> → ${esc(where)}`);
  }catch(e){
    en = byId(id);
    if(e.message === "auth" || !en) return;
    if(!en.cats.length){ en.cats = [0]; en.updatedAt = Date.now(); persist(); }
    toast("Auto-sort failed — filed under Community/Perspective; Edit to fix");
    if(dumpOpen()) dumpReceipt("Auto-sort failed — filed under Community/Perspective. Edit the entry to fix.");
  }
  finally{ pending.delete(id); render(); }
}

  else if(e.target.closest("[data-unused]")){ unusedOnly = !unusedOnly; saveUI(); render(); }
  else if(e.target.closest("[data-piqmatch]")){
    const n = +e.target.closest("[data-piqmatch]").dataset.piqmatch;
    openMatch();
    matchSuggestTag = "PIQ " + n;
    $("matchQ").value = PIQS[n];
    matchRun();
  }
  else if(e.target.closest("[data-piq]")){ piqOpen = !piqOpen; render(); }
  else if(e.target.closest("[data-page]")) goToPage(e.target.closest("[data-page]").dataset.page);
  else if(e.target.closest("[data-clip]")){ clipOpen = !clipOpen; render(); }
  else if(e.target.closest(".bml")){ // it's meant for the bookmarks bar, not for clicking here
    e.preventDefault();
    toast("Drag it to your bookmarks bar, then click it on any page");
  }
  else if(e.target.closest("[data-emptytrash]")){
    const old = state.trash;
    if(!old.length) return;
    old.forEach(purgeMark);
    state.trash = []; expanded = null;
    persist();
    toastAction(`Emptied ${old.length} deleted entr${old.length === 1 ? "y" : "ies"}`, "Undo", () => {
      const have = new Set(state.trash.map(t => t.id));
      const back = old.filter(t => !have.has(t.id) && !byId(t.id));
      back.forEach(t => { state.deleted[t.id] = t.deletedAt; });
      state.trash = [...state.trash, ...back].sort((a, b) => (b.deletedAt || 0) - (a.deletedAt || 0));
      persist();
    });
  }
  else if(e.target.closest("[data-tag]")) setTagFilter(e.target.closest("[data-tag]").dataset.tag);
  else if(e.target.closest("[data-renametag]") && tagFilter){
    if($("renameTagInput")) return $("renameTagInput").focus();
    e.target.closest("[data-renametag]").insertAdjacentHTML("afterend",
      ` <input id="renameTagInput" class="taginput" value="${esc(tagFilter)}">`);
    const inp = $("renameTagInput");
    inp.onkeydown = ev => {
      if(ev.key === "Enter"){
        const val = inp.value.trim();
        if(!val || val === tagFilter) return render();
        let n = 0;
        state.entries.forEach(en => {
          const tags = en.tags || [];
          const i = tags.findIndex(t => t.toLowerCase() === tagFilter.toLowerCase());
          if(i < 0) return;
          tags.splice(i, 1);
          if(!tags.some(t => t.toLowerCase() === val.toLowerCase())) tags.push(val);
          en.updatedAt = Date.now(); n++;
        });
        tagFilter = val;
        persist();
        toast(`Renamed to “${val}” on ${n} entr${n === 1 ? "y" : "ies"}`);
      } else if(ev.key === "Escape"){ ev.stopPropagation(); render(); }
    };
    inp.focus(); inp.select();
  }
  else if(e.target.closest("[data-removetag]") && tagFilter){
    const name = tagFilter;
    const affected = [];
    state.entries.forEach(en => {
      const i = (en.tags || []).findIndex(t => t.toLowerCase() === name.toLowerCase());
      if(i >= 0){ affected.push({ en, tag: en.tags[i], i }); en.tags.splice(i, 1); en.updatedAt = Date.now(); }
    });
    tagFilter = null;
    persist();
    toastAction(`Removed “${name}” from ${affected.length} entr${affected.length === 1 ? "y" : "ies"}`, "Undo", () => {
      affected.forEach(({ en, tag, i }) => {
        en.tags = en.tags || [];
        if(!en.tags.some(t => t.toLowerCase() === tag.toLowerCase()))
          en.tags.splice(Math.min(i, en.tags.length), 0, tag);
        en.updatedAt = Date.now();
      });
      tagFilter = name; persist();
    });
  }
};

// ---- Essays + Recently deleted rows (their ids aren't entries) ----
function promptClick(t, p){
  const hit = sel => t.closest(sel);
  if(hit("[data-act=collapse]")){ expanded = null; return render(); }
  if(hit("[data-pstatus]")){ p.status = hit("[data-pstatus]").dataset.pstatus; p.updatedAt = Date.now(); return persist(); }
  if(hit("[data-pickopen]")){ pickFor = p.id; pickQ = ""; render(); return $("pickq")?.focus(); }
  if(hit("[data-picktoggle]")){ togglePick(p, hit("[data-picktoggle]").dataset.picktoggle); return persist(); }
  if(hit("[data-unpick]")){ togglePick(p, hit("[data-unpick]").dataset.unpick); return persist(); }
  if(hit("[data-goentry]")){ const en = byId(hit("[data-goentry]").dataset.goentry); return en && palGoEntry(en); }
  if(hit("[data-pcopy]")) return copyFlip(promptBrief(p), hit("[data-pcopy]"));
  if(hit("[data-pfind]")){
    openMatch();
    matchSuggestTag = schTag(p.sch) || null; matchPromptId = p.id;
    $("matchQ").value = p.q;
    return matchRun();
  }
  if(hit("[data-pedit]")){ promptEdit = p.id; render(); return $("peq")?.focus(); }
  if(hit("[data-pesave]")) return savePromptEdit(p);
  if(hit("[data-pecancel]")){ promptEdit = null; return render(); }
  if(hit("[data-pdel]")) return removePrompt(p);
  if(hit(".ebody") || !window.getSelection().isCollapsed) return;
  expanded = expanded === p.id ? null : p.id;
  render();
}
function trashClick(t, id){
  const i = state.trash.findIndex(x => x.id === id);
  const rec = state.trash[i];
  if(t.closest("[data-act=collapse]")){ expanded = null; return render(); }
  if(t.closest("[data-restore]")){
    if(!rec) return;
    restoreEntries([rec]); expanded = null;
    persist();
    return toastAction(`Restored “${(rec.title || "Untitled").slice(0, 40)}”`, "Show it", () => {
      const en = byId(id); if(en) palGoEntry(en);
    });
  }
  if(t.closest("[data-purge]")){
    if(!rec) return;
    purgeMark(rec);
    state.trash.splice(i, 1); expanded = null;
    persist();
    return toastAction("Deleted for good", "Undo", () => {
      if(!byId(id) && !state.trash.some(x => x.id === id)){
        state.deleted[id] = rec.deletedAt;
        state.trash.splice(Math.min(i, state.trash.length), 0, rec);
      }
      persist();
    });
  }
  if(t.closest(".ebody") || !window.getSelection().isCollapsed) return;
  expanded = expanded === id ? null : id;
  render();
}

// ---- list interactions ----
$("view").onclick = e => {
  const t = e.target;
  if(t.closest("[data-newhere]")) return openComposer();
  if(t.closest("[data-unused]")){ unusedOnly = !unusedOnly; saveUI(); return render(); }
  const jog = t.closest("[data-jog]");
  if(jog){ jogN = +jog.dataset.jog; render(); return $("qadd").focus(); } // becomes the box's question
  if(t.closest("[data-padd]")){ addingPrompt = true; render(); return $("pq")?.focus(); }
  if(t.closest("[data-paddgo]")) return addPrompt();
  if(t.closest("[data-paddx]")){ addingPrompt = false; return render(); }
  const prow = t.closest(".prow");
  if(prow){ const p = promptById(prow.dataset.id); return p && promptClick(t, p); }
  const trow = t.closest(".trow");
  if(trow) return trashClick(t, trow.dataset.id);
  const sugBtn = t.closest(".tagsug");
  if(sugBtn){
    if("create" in sugBtn.dataset) addTag($("view").querySelector(".taginput")?.value);
    else addTag(curSugs[+sugBtn.dataset.sug]);
    return;
  }
  if(t.closest(".taginput")) return;
  const row = t.closest(".entry"); if(!row) return;
  const id = row.dataset.id, en = byId(id);
  const del = t.closest("[data-deltag]");
  if(del){
    if(en && en.tags){ en.tags.splice(+del.dataset.deltag, 1); en.updatedAt = Date.now(); persist(); }
    return;
  }
  const chip = t.closest("[data-tag]");
  if(chip) return setTagFilter(chip.dataset.tag);
  const ec = t.closest(".ecat[data-cat]");
  if(ec){
    goToCategory(+ec.dataset.cat);
    expanded = id; render();
    $("view").querySelector(`[data-id="${id}"]`)?.scrollIntoView({block:"center"});
    return;
  }
  if(t.closest(".tagadd")) return showTagInput();
  if(t.closest(".star")){
    if(en){ en.pinned = !en.pinned; persist(); }
    return;
  }
  if(t.closest(".rowpick")){
    selected.has(id) ? selected.delete(id) : selected.add(id);
    return render();
  }
  const rf = t.closest("[data-refile]");
  if(rf){
    if(!en) return;
    const ci = +rf.dataset.refile;
    if(en.cats.includes(ci)){
      if(en.cats.length === 1) return toast("An entry needs at least one category");
      en.cats = en.cats.filter(x => x !== ci);
    } else en.cats = [...en.cats, ci].sort((a,b) => a - b);
    en.updatedAt = Date.now();
    persist();
    return;
  }
  const act = t.closest("[data-act]")?.dataset.act;
  if(act){
    if(!en) return;
    if(act === "copy") return copyFlip(en.body, t.closest("[data-act]")); // verbatim — body only, no AI title
    if(act === "polish"){
      const btn = t.closest("[data-act]");
      btn.disabled = true; btn.textContent = "✦ Polishing…";
      api("POST", "/polish", { body: en.body }).then(r => {
        if(r.text) polished.set(en.id, r.text);
        else toast("Polish failed — try again");
        render();
      }).catch(err => {
        if(err.message !== "auth") toast("Polish failed — try again");
        render();
      });
      return;
    }
    if(act === "copypolish") return copyFlip(polished.get(id) || "", t.closest("[data-act]"));
    if(act === "hidepolish"){ polished.delete(id); return render(); }
    if(act === "edit") return openComposer(en);
    if(act === "collapse"){ expanded = null; return render(); }
    if(act === "del"){
      const recs = trashEntries([id]); // to Recently deleted, restorable for 30 days
      if(!recs.length) return;
      persist();
      toastAction(`Deleted “${(recs[0].title || "Untitled").slice(0, 40)}”`, "Undo", () => {
        restoreEntries(recs);
        persist();
      });
    }
    return;
  }
  if(t.closest(".ebody")) return;
  if(!window.getSelection().isCollapsed) return;
  expanded = expanded === id ? null : id;
  render();
};
// Keys, typing and field commits inside the Essays forms and picker.
$("view").onkeydown = e => {
  const id = e.target.id;
  if(e.key === "Escape"){
    if(id === "pickq"){ e.stopPropagation(); pickFor = null; return render(); }
    if(["pq", "psch", "pdue", "plim"].includes(id)){ e.stopPropagation(); addingPrompt = false; return render(); }
    if(["peq", "pesch"].includes(id)){ e.stopPropagation(); promptEdit = null; return render(); }
    return;
  }
  if(e.key !== "Enter" || e.isComposing) return;
  const cmd = e.metaKey || e.ctrlKey;
  if(["psch", "pdue", "plim"].includes(id) || (id === "pq" && cmd)){ e.preventDefault(); return addPrompt(); }
  if(id === "pesch" || (id === "peq" && cmd)){
    e.preventDefault();
    const p = promptById(promptEdit); return p && savePromptEdit(p);
  }
  if(id === "pickq"){ // Enter picks the top result that isn't picked yet
    e.preventDefault();
    $("pickres")?.querySelector(".pickopt:not(.on)")?.click();
  }
  if(e.target.dataset.pfield) e.target.blur(); // commits through the change handler
};

// Merge: the oldest selected entry absorbs the others (texts joined, categories
// and tags combined); the rest go to Recently deleted, so nothing is lost.
$("mergeSel").onclick = () => {
  const picks = state.entries.filter(e => selected.has(e.id)).sort((a, b) => a.createdAt - b.createdAt);
  if(picks.length < 2) return;
  const [base, ...rest] = picks;
  const before = { ...base, cats: [...base.cats], tags: [...(base.tags || [])] };
  const bodies = [], tags = [];
  picks.forEach(e => {
    const b = e.body.trim();
    if(b && !bodies.includes(b)) bodies.push(b);
    (e.tags || []).forEach(t => { if(!tags.some(x => x.toLowerCase() === t.toLowerCase())) tags.push(t); });
  });
  Object.assign(base, {
    title: base.title || picks.find(e => e.title)?.title || "",
    body: bodies.join("\n\n"),
    cats: [...new Set(picks.flatMap(e => e.cats))].sort((a, b) => a - b),
    tags, pinned: picks.some(e => e.pinned), updatedAt: Date.now()
  });
  polished.delete(base.id);
  // Prompts that picked a merged-away entry now point at the merged one.
  const gone = new Set(rest.map(e => e.id)), repicked = [];
  mapPrompts().forEach(p => {
    if(!(p.picks || []).some(id => gone.has(id))) return;
    repicked.push({ p, picks: [...p.picks] });
    p.picks = [...new Set(p.picks.map(id => gone.has(id) ? base.id : id))];
    p.updatedAt = Date.now();
  });
  const recs = trashEntries([...gone]);
  selected.clear(); expanded = base.id;
  persist();
  toastAction(`Merged ${picks.length} entries into one`, "Undo", () => {
    const cur = byId(before.id);
    if(cur) Object.assign(cur, before, { updatedAt: Date.now() });
    restoreEntries(recs);
    repicked.forEach(({ p, picks }) => { p.picks = picks; p.updatedAt = Date.now(); });
    persist();
  });
};

function download(text, name, type){
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], { type }));
  a.download = name;
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

  $("expMenu").hidden = true; $("export").setAttribute("aria-expanded", false);

  const day = `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
  if(b.dataset.exp === "json"){
    download(JSON.stringify({ app: "liboc", version: 2, exportedAt: new Date().toISOString(),
      entries: state.entries, prompts: mapPrompts() }, null, 2), `liboc-${day}.json`, "application/json");
    state.backupRev = state.rev;

// Readable copies list each entry once, under its first category (other
// categories are noted), pinned first — the same order as the category pages.
function readableSections(){
  const first = e => e.cats.length ? Math.min(...e.cats) : 0;
  return CATEGORIES.map((name, i) => ({ name, i, items: state.entries.filter(e => first(e) === i)
      .sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.createdAt - a.createdAt) }))
    .filter(s => s.items.length);
}
const entryNote = (e, i) => [
  e.cats.some(c => c !== i) ? `Also in ${e.cats.filter(c => c !== i).map(c => CATEGORIES[c]).join(", ")}` : "",
  (e.tags || []).length ? `Used in ${e.tags.join(", ")}` : "",
  `Added ${fmtDate(e.createdAt)}`
].filter(Boolean).join(" · ");
const promptNote = p => [p.due ? `due ${fmtDueLong(p.due)}` : "", p.limit ? `${p.limit} words` : "",
  STATUS[p.status] || STATUS.todo].filter(Boolean).join(" · ");
const longDate = () => new Date().toLocaleDateString(undefined, { month: "long", day: "numeric", year: "numeric" });
const countLine = () => `${state.entries.length} entr${state.entries.length === 1 ? "y" : "ies"}`;
function readableMarkdown(){
  const out = ["# Library of College", `_Exported ${longDate()} · ${countLine()}_`];
  const ps = sortedPrompts();
  if(ps.length){
    out.push("## Essays");
    ps.forEach(p => {
      const picks = promptPicks(p);
      out.push(`### ${p.sch || "Untitled prompt"}`, `_${promptNote(p)}_`, p.q.split("\n").map(l => "> " + l).join("\n"));
      if(picks.length) out.push(`Stories: ${picks.map(e => e.title || "Untitled").join(" · ")}`);
    });
  }
  readableSections().forEach(s => {
    out.push(`## ${s.name}`);
    // A body line starting with # or > would turn into a heading or quote.
    s.items.forEach(e => out.push(`### ${e.title || "Untitled"}`, `_${entryNote(e, s.i)}_`,
      e.body.replace(/^([#>])/gm, "\\$1")));
  });
  return out.join("\n\n") + "\n";
}
function printLibrary(){
  const h = [`<h1>Library of College</h1><p class="pmeta">Exported ${longDate()} · ${countLine()}</p>`];
  const ps = sortedPrompts();
  if(ps.length){
    h.push("<h2>Essays</h2>");
    ps.forEach(p => {
      const picks = promptPicks(p);
      h.push(`<section><h3>${esc(p.sch || "Untitled prompt")}</h3><p class="pmeta">${esc(promptNote(p))}</p>
        <blockquote>${esc(p.q)}</blockquote>${picks.length
          ? `<p class="pmeta">Stories: ${esc(picks.map(e => e.title || "Untitled").join(" · "))}</p>` : ""}</section>`);
    });
  }
  readableSections().forEach(s => {
    h.push(`<h2>${esc(s.name)}</h2>`);
    s.items.forEach(e => h.push(`<section><h3>${esc(e.title || "Untitled")}</h3>
      <p class="pmeta">${esc(entryNote(e, s.i))}</p><div class="pbody">${esc(e.body)}</div></section>`));
  });
  $("printout").innerHTML = h.join("");
  document.body.classList.add("printing");
  addEventListener("afterprint", () => {
    document.body.classList.remove("printing");
    $("printout").innerHTML = "";
  }, { once: true });
  print();
}
$("importBtn").onclick = () => $("importFile").click();
$("importFile").onchange = e => {
  const f = e.target.files[0]; if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try{
      // Backups are either the bare entries array (exports before prompts were
      // included) or {entries, prompts}. Only ids this library lacks are added.
      const data = JSON.parse(r.result);
      const inE = Array.isArray(data) ? data : Array.isArray(data?.entries) ? data.entries : null;
      if(!inE) throw 0;
      const inP = Array.isArray(data?.prompts) ? data.prompts : [];
      const now = Date.now();
      // Importing something deleted here is a deliberate restore: outrank its tombstone.
      const revive = x => {
        const t = state.deleted[x.id];
        if(t){ delete state.deleted[x.id]; x.updatedAt = Math.max(now, t + 1); }
        return x;
      };
      // Ids land in HTML attributes, so a file can only bring the kind newId() makes.
      const okId = id => typeof id === "string" && /^[\w-]{1,64}$/.test(id);
      const haveE = new Set(state.entries.map(x => x.id));
      const addE = inE.filter(x => x && okId(x.id) && typeof x.body === "string" && !haveE.has(x.id))
        .map(x => {
          const cats = [...new Set((Array.isArray(x.cats) ? x.cats : []).map(Number)
            .filter(c => Number.isInteger(c) && c >= 0 && c <= 6))].sort((a, b) => a - b);
          return revive({ id: x.id, title: String(x.title || ""), body: x.body, cats: cats.length ? cats : [0],
            pinned: !!x.pinned, tags: Array.isArray(x.tags) ? x.tags.filter(t => typeof t === "string") : [],
            createdAt: +x.createdAt || now, updatedAt: +x.updatedAt || +x.createdAt || now });
        });
      const haveP = new Set(mapPrompts().map(x => x.id));
      const addP = inP.filter(x => x && okId(x.id) && typeof x.q === "string" && !haveP.has(x.id))
        .map(x => revive({ id: x.id, q: x.q.slice(0, 2000), sch: String(x.sch || "").slice(0, 120),
          due: validDue(x.due), limit: +x.limit > 0 ? Math.min(+x.limit, 5000) : 0,
          status: STATUS[x.status] ? x.status : "todo",
          picks: Array.isArray(x.picks) ? x.picks.filter(okId) : [],
          createdAt: +x.createdAt || now, updatedAt: +x.updatedAt || +x.createdAt || now }));
      const back = new Set(addE.map(x => x.id));
      state.trash = state.trash.filter(t => !back.has(t.id));
      state.entries = [...addE, ...state.entries].sort((a, b) => b.createdAt - a.createdAt);
      state.prompts = [...addP, ...mapPrompts()];
      persist();
      toast(`Imported ${addE.length} new entr${addE.length === 1 ? "y" : "ies"}${
        addP.length ? ` and ${addP.length} prompt${addP.length === 1 ? "" : "s"}` : ""}`);
    }catch(err){ toast("Could not read that file"); }
    e.target.value = "";
  };
  r.readAsText(f);
};

// ---- render ----
function navHTML(){
  return `<button class="navitem dumpnav" data-dump title="Write anything — AI titles it and files it (press d)">
      <span class="cdot dump">✦</span><span class="navlab">Quick dump</span><span class="navn"><span class="kbd">d</span></span>
    </button>
    <button class="navitem dumpnav" data-match title="Paste an essay prompt — AI finds your best-fitting stories (press m)">
      <span class="cdot dump">⌕</span><span class="navlab">Match a prompt</span><span class="navn"><span class="kbd">m</span></span>
    </button>`
  + essaysNavHTML()
  + GROUPS.map((g, gi) =>
    (gi ? `<span class="navsep"></span>` : "")
    + `<div class="navgroup">${g.label}</div>`
    + g.cats.map(i => {
        const n = state.entries.filter(e => e.cats.includes(i)).length;
        return `<button class="navitem ${nav === i && !query && !tagFilter && !page ? "on" : ""}" data-nav="${i}">
          <span class="cdot" style="background:var(--c${i})"></span>
          <span class="navlab">${CATEGORIES[i]}</span><span class="navn ${n && n < 3 ? "thin" : ""}"${
            n && n < 3 ? ` title="Only ${n} entr${n === 1 ? "y" : "ies"} — thin for essay season"` : ""}>${n || ""}</span>
        </button>`;
      }).join("")
  ).join("")
  + tagNavHTML()
  + trashNavHTML();
}
// Essays sits with the top actions; its badge is the nearest open deadline
// (or the count of open prompts when none has a date).
function essaysNavHTML(){
  const d = nextDeadline(), open = mapPrompts().filter(p => p.status !== "done").length;
  return `<button class="navitem pagenav ${page === "essays" && !query && !tagFilter ? "on" : ""}" data-page="essays"
      title="${d === null ? "Your essay prompts — deadlines, word limits, picked stories" : `Next deadline: ${daysPhrase(d)}`}">
      <span class="cdot dump">✎</span><span class="navlab">Essays</span><span class="navn ${d !== null && d <= 7 ? "thin" : ""}">${
        d !== null ? shortDays(d) : open || ""}</span>
    </button>`;
}
// Only shown while something is in it.
function trashNavHTML(){
  const n = (state.trash || []).length;
  if(!n) return "";
  return `<span class="navsep"></span><button class="navitem trashnav ${page === "trash" && !query && !tagFilter ? "on" : ""}"
      data-page="trash" title="Deleted entries — restorable for ${TRASH_DAYS} days">
      <span class="cdot dump">↺</span><span class="navlab">Recently deleted</span><span class="navn">${n}</span>
    </button>`;
}

function tagNavHTML(){
  const tags = allTags();
  if(!tags.length) return "";
  return `<span class="navsep"></span><div class="navgroup">Used in</div>`
    + tags.map(t => {
        const n = state.entries.filter(e =>
          (e.tags || []).some(x => x.toLowerCase() === t.toLowerCase())).length;
        return `<button class="navitem ${tagFilter && tagFilter.toLowerCase() === t.toLowerCase() ? "on" : ""}"
            data-tagnav="${esc(t)}" title="Everything used in ${esc(t)}">
          <span class="cdot tagdot"></span>
          <span class="navlab">${esc(t)}</span><span class="navn">${n}</span>
        </button>`;
      }).join("");
}

function rowHTML(e, col, showNames){
  const isOpen = expanded === e.id;
  const others = col >= 0 ? e.cats.filter(c => c !== col) : e.cats;
  const dots = !showNames && !isOpen && others.length
    ? `<span class="dots">${others.map(c =>
        `<span class="dot" style="background:var(--c${c})" title="${CATEGORIES[c]}"></span>`).join("")}</span>`
    : "";
  const names = (showNames || isOpen)
    ? `<div class="ecats">${e.cats.length ? e.cats.map(c =>
        `<span class="ecat" data-cat="${c}" title="Go to ${CATEGORIES[c]}"><span class="dot" style="background:var(--c${c})"></span>${CATEGORIES[c]}</span>`).join("")
        : `<span class="ecat">✦ sorting…</span>`}</div>`
    : "";
  const words = wc(e.body);
  const tags = e.tags || [];

  const collapsedBits = isOpen ? "" :
    (e.body ? `<p class="snip">${query ? palSnip(e, query) : esc(e.body.slice(0, 300))}</p>` : "")
    + names
    + (tags.length
      ? `<div class="rowtags">${tags.map(t =>
          `<span class="rtag mini" data-tag="${esc(t)}" title="See everything used in ${esc(t)}">${esc(t)}</span>`).join("")}</div>`
      : "");

  const openBits = !isOpen ? "" : `
    <div class="ebody">
      <p class="meta">Added ${fmtDate(e.createdAt)}${
        e.updatedAt - e.createdAt > 60000 ? ` · edited ${fmtDate(e.updatedAt)}` : ""}${
        words ? ` · ${words} word${words === 1 ? "" : "s"}` : ""}</p>
      <div class="usedin">${tags.map((t,i) =>
          `<span class="rtag" data-tag="${esc(t)}" title="See everything used in ${esc(t)}">${esc(t)}<button class="tagx" data-deltag="${i}" title="Remove tag">×</button></span>`).join("")}
        <button class="tagadd" title="Track which essay or school this story has been used in">+ used in</button>
      </div>
      <div class="full">${esc(e.body)}</div>
      ${polished.has(e.id) ? `<div class="polished">
        <div class="pollab">✦ GPT-4.1 mini polish — your original above is untouched
          <span class="spacer"></span>
          <button class="linkbtn" data-act="copypolish">Copy polished</button>
          <button class="linkbtn" data-act="hidepolish">Hide</button>
        </div>
        <div class="full">${esc(polished.get(e.id))}</div>
      </div>` : ""}
      <div class="refile"><span class="chiplab">Filed under</span>${CATEGORIES.map((c,ci) =>
        `<button class="chip mini ${e.cats.includes(ci) ? "on" : ""}" data-refile="${ci}" data-c="${ci}"
          type="button" title="${e.cats.includes(ci) ? "Remove from" : "Also file under"} ${c}">${c}</button>`).join("")}
      </div>
      <div class="eacts">
        <button class="primary" data-act="copy" title="Copies your writing verbatim — the AI title is never included">Copy text</button>
        <button data-act="edit">Edit</button>
        <button class="ghost" data-act="polish" title="GPT-4.1 mini tidies grammar and wordiness in a separate box — never touches your original">${polished.has(e.id) ? "✦ Re-polish" : "✦ Polish"}</button>
        <span class="spacer"></span>
        <button class="ghost danger" data-act="del">Delete</button>
        <button class="ghost" data-act="collapse">Collapse</button>
      </div>
    </div>`;

  return `<article class="entry ${isOpen ? "open" : ""} ${selected.has(e.id) ? "sel" : ""}" data-id="${esc(e.id)}">
    <div class="ehead">
      <div class="etext">
        <h3>${esc(e.title) || `<span class="untitled">${pending.has(e.id) ? "✦ titling…" : "Untitled"}</span>`}${dots}</h3>
        ${isOpen ? names : collapsedBits}
      </div>
      <div class="eside">
        <div class="ectl">
          <span class="star ${e.pinned ? "on" : ""}" title="${e.pinned ? "Unpin" : "Pin to top"}">★</span>
          <span class="rowpick" title="Select for bulk copy"></span>
        </div>
        ${!isOpen && words ? `<span class="ewc">${words} words</span>` : ""}
      </div>
    </div>
    ${openBits}
  </article>`;
}

function render(){
  $("nav").innerHTML = navHTML();
  $("qadd").style.display = (query || tagFilter || page) ? "none" : "";
  // A memory jogger for this category; it only changes on a quick add or a
  // category switch, never per render.
  $("qadd").placeholder = innerWidth < 760 ? jogger(nav) : `${jogger(nav)} — Enter saves`;
  $("qadd").title = `Add to ${CATEGORIES[nav]} — Enter saves · Shift+Enter for a new line`;
  renderStatus();

  $("bulk").classList.toggle("on", selected.size > 0);
  $("bulkCount").textContent = `${selected.size} selected`;
  $("mergeSel").hidden = selected.size < 2;
  document.body.classList.toggle("selecting", selected.size > 0);

  keepInputs(renderView);
}
// Inline editors live inside re-rendered markup — carry their text, focus and
// caret across a render, so a background update never eats what you're typing.
function keepInputs(paint){
  const kept = [...document.querySelectorAll("#viewhead [data-keep], #view [data-keep]")].map(el => ({
    k: el.dataset.keep, v: el.value, f: el === document.activeElement, s: el.selectionStart, e: el.selectionEnd,
    mirror: !!el.dataset.pfield }));
  paint();
  for(const x of kept){
    const el = document.querySelector(`[data-keep="${x.k}"]`);
    // Fields that mirror saved state (deadline, word limit) take the fresh
    // value unless they're mid-edit; forms and the picker filter are buffers.
    if(!el || (x.mirror && !x.f)) continue;
    el.value = x.v;
    if(x.f){ el.focus(); try{ el.setSelectionRange(x.s, x.e); }catch(_){ /* date/number inputs */ } }
  }
}
function renderView(){
  const n = state.entries.length;

  if(query){
    const hits = state.entries.filter(e =>
      (e.title + " " + e.body + " " + (e.tags || []).join(" ")).toLowerCase().includes(query));
    viewIds = hits.map(e => e.id);
    $("viewhead").innerHTML = `<h2>Search</h2>
      <p class="sub2">${hits.length} match${hits.length === 1 ? "" : "es"} for “${esc(qraw.trim())}” across all categories</p>`;
    $("view").innerHTML = hits.length
      ? hits.map(e => rowHTML(e, -1, true)).join("")
      : `<p class="empty">Nothing matches. Try a shorter word — search covers titles and full text.</p>`;
    return;
  }

  if(tagFilter){
    const list = state.entries.filter(e =>
      (e.tags || []).some(t => t.toLowerCase() === tagFilter.toLowerCase()));
    viewIds = list.map(e => e.id);
    $("viewhead").innerHTML = `<h2><span class="rtag htag">${esc(tagFilter)}</span></h2>
      <p class="sub2">${list.length} entr${list.length === 1 ? "y" : "ies"} already used here, across every category.
        ${list.length ? `<span class="nowrap"><button class="linkbtn" data-copyall>Copy all</button> ·</span> ` : ""}<span class="nowrap"><button class="linkbtn" data-renametag>rename</button> ·</span> <span class="nowrap"><button class="linkbtn" data-removetag title="Remove this tag from every entry">remove tag</button> ·</span> <button class="linkbtn" data-cleartag>← Back to ${hereName()}</button></p>`;
    $("view").innerHTML = list.length
      ? list.map(e => rowHTML(e, -1, true)).join("")
      : `<p class="empty">No entries carry this tag anymore.
         <button class="linkbtn" data-cleartag>Back</button>.</p>`;
    return;
  }

  if(page === "essays") return renderEssays();
  if(page === "trash") return renderTrash();

  const i = nav;
  const full = state.entries.filter(e => e.cats.includes(i))
    .sort((a,b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0) || b.createdAt - a.createdAt);
  const list = unusedOnly ? full.filter(e => !(e.tags || []).length) : full;
  viewIds = list.map(e => e.id);
  const unusedBtn = unusedOnly
    ? `<button class="linkbtn nowrap" data-unused>showing ${list.length} of ${full.length} unused — show all</button>`
    : (full.some(e => (e.tags || []).length) ? `<button class="linkbtn nowrap" data-unused>unused only</button>` : "");
  // Why School points at the Essays page (where the prompt map lives now) and
  // offers the web clipper; the other categories keep their UC PIQ guide.
  $("viewhead").innerHTML = `<h2><span class="hl" style="--hc:var(--c${i})">${CATEGORIES[i]}</span></h2>
    <p class="sub2">${PROMPTS[i]}${list.length > 1 ? ` <button class="linkbtn nowrap" data-copyall>Copy all ${list.length}</button>` : ""}${unusedBtn ? ` ${unusedBtn}` : ""}${
      full.length > 0 && full.length < 3 && !unusedOnly
        ? `<span class="thinnote">Only ${full.length} stor${full.length === 1 ? "y" : "ies"} shelved here — worth a quick dump session.</span>` : ""} ${
      i === 2 ? `<button class="linkbtn nowrap" data-page="essays">your essay prompts →</button> <button class="linkbtn nowrap" data-clip>${clipOpen ? "hide clipper" : "clip from websites"}</button>`
              : `<button class="linkbtn nowrap" data-piq>${piqOpen ? "hide PIQ guide" : "UC PIQ guide"}</button>`}</p>${
      i === 2 ? (clipOpen ? `<div class="piqguide">${clipGuideHTML()}</div>` : "")
              : (piqOpen ? `<div class="piqguide">${piqGuideHTML(i)}</div>` : "")}`;
  $("view").innerHTML = list.length
    ? list.map(e => rowHTML(e, i, false)).join("")
    : (n === 0
      ? `<div class="empty">The library is empty. Hit <strong>✦ Quick dump</strong> and write any story,
         detail, or moment you might use — AI titles it and files it into the right categories.
         An entry can live in more than one category, and sorting can always change later.
         Or answer one of these in the box above:</div>${jogsHTML(i)}`
      : unusedOnly && full.length
        ? `<div class="empty">All ${full.length} entries here are already used somewhere.
           <button class="linkbtn" data-unused>Show all</button>.</div>`
        : `<div class="empty">Nothing filed here yet.
           <button class="linkbtn" data-newhere>Add the first one</button>, or answer one of these in the box above:</div>${jogsHTML(i)}`);
}
render(); // boot() runs from clerkInit once auth is ready
if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").catch(() => {});
</script>
</body>

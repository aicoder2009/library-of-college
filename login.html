<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#faf8f3">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#191712">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
<link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png">
<title>Sign in — Library of College</title>
<style>
  :root{
    --bg:#faf8f3; --panel:#fffdf8; --ink:#221f1a; --muted:#756e64; --faint:#aca397;
    --faint-text:#8a8276;
    --line:#e6e0d4;
    --warn:#c2410c;
    --tagbg:#eadfc6; --tagink:#6d5f42;
    --serif:ui-serif,"Iowan Old Style",Georgia,"Times New Roman",serif;
    --lift:0 8px 28px rgba(30,25,15,.08);
    --hc:#f3b97a;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#191712; --panel:#211e18; --ink:#ede8dd; --muted:#a29a8b; --faint:#6f695e;
      --faint-text:#857d6f;
      --line:#322e26;
      --warn:#fb923c;
      --tagbg:#35301f; --tagink:#c9b988;
      --lift:0 8px 28px rgba(0,0,0,.4);
    }
  }
  *{box-sizing:border-box}
  ::selection{background:var(--tagbg);color:var(--ink)}
  body{margin:0;min-height:100svh;display:flex;background:var(--bg);color:var(--ink);
    font:16px/1.6 ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;padding:24px}
  a{color:inherit}
  :where(a):focus-visible{outline:2px solid var(--muted);outline-offset:2px;border-radius:4px}
  .hl{background:linear-gradient(transparent 60%,var(--hc) 0);padding:0 2px;margin:0 -2px}
  @media (prefers-color-scheme: dark){
    .hl{background:linear-gradient(transparent calc(100% - 3px),var(--hc) 0)}
  }
  main{margin:auto;width:100%;max-width:420px;text-align:center}
  .brand{font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:-.01em;
    text-decoration:none;display:inline-block;margin-bottom:6px}
  #lockText{color:var(--muted);font-size:13.5px;margin:0 0 18px}
  #clerkMount{display:flex;justify-content:center}
  .lockerr{color:var(--warn);font-size:12.5px;min-height:18px;margin-top:12px}
  .alt{color:var(--faint-text);font-size:13px;margin-top:22px;line-height:1.6}
  .alt a{color:var(--muted);font-weight:600}
  .alt a:hover{color:var(--ink)}
  .wl-note{color:var(--muted);font-size:14px;line-height:1.65;margin:10px 0 0}
  .wl-note a{color:var(--ink);font-weight:600}
  .wl-tag{display:inline-block;background:var(--tagbg);color:var(--tagink);
    border-radius:6px;padding:1px 8px;font-weight:600;font-size:13px}
</style>
</head>
<body>
<main>
  <a class="brand" href="/"><span class="hl">L</span>ibrary of College</a>
  <p id="lockText">Loading sign-in…</p>
  <div id="clerkMount"></div>
  <div class="lockerr" id="lockErr"></div>
  <p class="alt">New here? <a href="/#waitlist">Join the waitlist</a> — accounts are
    approved by hand while LoC is in beta.</p>
</main>

<script>
const $ = id => document.getElementById(id);
const API = "https://3abskrlijk.execute-api.us-east-1.amazonaws.com";
// liboc.vercel.app runs the Clerk PROD instance through the /__clerk proxy;
// localhost and the legacy aliases stay on the dev instance.
const CLERK_LIVE = location.hostname === "liboc.vercel.app";
const CLERK_PK = CLERK_LIVE
  ? "pk_live_Y2xlcmsubGlib2MudmVyY2VsLmFwcCQ"
  : "pk_test_bGFzdGluZy1mYWxjb24tOTEuY2xlcmsuYWNjb3VudHMuZGV2JA";

(() => { // load ClerkJS via the proxy (prod) or the FAPI encoded in the key (dev)
  const base = CLERK_LIVE ? location.origin + "/__clerk"
    : "https://" + atob(CLERK_PK.split("_")[2]).replace(/\$$/, "");
  const s = document.createElement("script");
  s.src = `${base}/npm/@clerk/clerk-js@5/dist/clerk.browser.js`;
  s.crossOrigin = "anonymous";
  s.setAttribute("data-clerk-publishable-key", CLERK_PK);
  if(CLERK_LIVE) s.setAttribute("data-clerk-proxy-url", location.origin + "/__clerk");
  s.onload = clerkInit;
  s.onerror = () => { $("lockText").textContent = "Couldn’t load sign-in — check your connection and refresh."; };
  document.head.appendChild(s);
})();

window.addEventListener("unhandledrejection", e => {
  $("lockErr").textContent = "Sign-in error: " + (e.reason?.message || e.reason);
});

// Friendly copy for the not-invited-yet paths: the restricted-access screen a
// stranger's Google attempt lands on, the unknown-email error, and the card's
// waitlist action line. Tone matches the landing page.
const CLERK_COPY = {
  signIn: { start: {
    actionText__join_waitlist: "Not invited yet?",
    actionLink__join_waitlist: "Join the waitlist",
  }},
  signUp: { restrictedAccess: {
    title: "You’re not in — yet",
    subtitleWaitlist: "That account isn’t invited yet. Accounts are approved by hand while Library of College is in beta — join the waitlist and your invite will land by email.",
    subtitle: "That account isn’t invited yet. Accounts are approved by hand while Library of College is in beta.",
    blockButton__joinWaitlist: "Join the waitlist",
  }},
  unstable__errors: {
    not_allowed_access: "That account isn’t invited yet — join the waitlist on the home page and your invite will land by email.",
    form_identifier_not_found: "No account matches that email yet. Library of College is invite-only while in beta — join the waitlist and we’ll email your invite.",
  },
};

async function clerkInit(){
  const watchdog = setTimeout(() => {
    if($("lockText").textContent === "Loading sign-in…")
      $("lockErr").textContent =
        "Still connecting to sign-in… a content blocker may be blocking clerk.accounts.dev";
  }, 10000);
  try{ await window.Clerk.load({ localization: CLERK_COPY }); }
  catch(e){
    clearTimeout(watchdog);
    $("lockText").textContent = "Couldn’t load sign-in — refresh to retry.";
    $("lockErr").textContent = e?.message || "";
    return;
  }
  clearTimeout(watchdog);
  if(window.Clerk.user){ // already signed in: straight to the app
    $("lockText").textContent = "Opening the library…";
    location.replace("/app");
    return;
  }
  // Came back from Google with an account we don't know? Handle it ourselves —
  // the prebuilt card's sign-up transfer throws in waitlist mode.
  if(/sso-callback/.test(location.hash) && await handleUninvitedOauth()) return;
  $("lockText").textContent = "Sign in to open the library.";
  // Dress the Clerk card in the app's own palette (tracks light/dark automatically)
  const css = getComputedStyle(document.documentElement);
  const v = n => css.getPropertyValue(n).trim();
  window.Clerk.mountSignIn($("clerkMount"), {
    fallbackRedirectUrl: "/app", forceRedirectUrl: "/app",
    // Landing page — its hero IS the waitlist form. (Not "/#waitlist": Clerk's
    // router appends a trailing slash to hash URLs, which kills the anchor.)
    waitlistUrl: "/",
    appearance: {
    variables: {
      colorPrimary: v("--ink"),
      colorTextOnPrimaryBackground: v("--bg"),
      colorPrimaryForeground: v("--bg"),
      colorBackground: v("--panel"),
      colorText: v("--ink"),
      colorTextSecondary: v("--muted"),
      colorInputBackground: v("--bg"),
      colorInputText: v("--ink"),
      colorDanger: v("--warn"),
      borderRadius: "10px",
      fontFamily: 'ui-sans-serif,-apple-system,"Segoe UI",system-ui,sans-serif',
      fontSize: "15px"
    },
    elements: {
      card: { boxShadow: v("--lift"), border: "1px solid " + v("--line") },
      cardBox: { boxShadow: "none" },
      headerTitle: { fontFamily: v("--serif"), fontWeight: "600", letterSpacing: "-.01em" },
      formButtonPrimary: { fontWeight: "600", fontSize: "14px", textTransform: "none" },
      formFieldInput: { fontSize: "14px" },
      socialButtonsBlockButton: { color: v("--ink"), borderColor: v("--line") },
      socialButtonsBlockButtonText: { color: v("--ink") }
    }
  }});
  // Belt and braces: if Clerk signs the user in without navigating, go ourselves
  window.Clerk.addListener(({ user }) => { if(user) location.replace("/app"); });
}

// An OAuth round-trip that found no matching account leaves the sign-in
// verification "transferable" (or failed with a restricted/not-found error).
// Instead of surfacing Clerk's error, add the Google email to the waitlist and
// say so warmly. Returns true when it took over the page.
async function handleUninvitedOauth(){
  try{
    const client = window.Clerk.client || {};
    const v = client.signIn && client.signIn.firstFactorVerification;
    const suExt = client.signUp && client.signUp.verifications &&
      client.signUp.verifications.externalAccount;
    const blocked = code => /not_found|not_allowed|restricted/.test(code || "");
    const orphan =
      (v && (v.status === "transferable" || blocked(v.error && v.error.code))) ||
      (suExt && (suExt.status === "transferable" || blocked(suExt.error && suExt.error.code)));
    if(!orphan) return false;

    let email = client.signUp && client.signUp.emailAddress;
    if(!email && v && v.status === "transferable"){
      try{ // try the transfer ourselves: if sign-ups are open it just works…
        const res = await client.signUp.create({ transfer: true });
        if(res.status === "complete"){
          await window.Clerk.setActive({ session: res.createdSessionId });
          location.replace("/app");
          return true;
        }
        email = res.emailAddress || null;
      }catch(e){ // …and in waitlist mode it throws, often after echoing the email
        email = (window.Clerk.client.signUp && window.Clerk.client.signUp.emailAddress) || null;
      }
    }

    history.replaceState(null, "", "/login"); // drop the #/sso-callback route
    let joined = null;
    if(email){
      try{
        const r = await fetch(API + "/waitlist", { method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email }),
          signal: AbortSignal.timeout(10000) });
        const d = await r.json().catch(() => ({}));
        if(r.ok && d.ok) joined = d;
      }catch{}
    }
    renderNotInvited(email, joined);
    return true;
  }catch(e){ return false; } // anything unexpected: fall through to the normal card
}

function renderNotInvited(email, joined){
  $("lockText").textContent = joined
    ? (joined.dup ? "You’re already on the waitlist." : "You’re on the waitlist.")
    : "That account isn’t invited yet.";
  const box = $("clerkMount");
  box.textContent = "";
  const wrap = document.createElement("div"); // clerkMount is a flex ROW — stack inside one column
  const note = document.createElement("p");
  note.className = "wl-note";
  if(joined){
    if(joined.position){
      const tag = document.createElement("span");
      tag.className = "wl-tag";
      tag.textContent = "#" + joined.position + " in line";
      note.append(tag, " ");
    }
    note.append((email ? email + (joined.dup ? " was already in line." : " just joined the list.")
      : (joined.dup ? "You’re already in line." : "You just joined the list."))
      + " Accounts are approved by hand while Library of College is in beta — your invite will land by email.");
  }else{
    note.append("Library of College is invite-only while in beta. ");
    const a = document.createElement("a");
    a.href = "/"; a.textContent = "Join the waitlist";
    note.append(a, " and your invite will land by email.");
  }
  const retry = document.createElement("p");
  retry.className = "wl-note";
  const b = document.createElement("a");
  b.href = "/login"; b.textContent = "Try a different account";
  retry.append(b);
  wrap.append(note, retry);
  box.append(wrap);
}
</script>
</body>
</html>

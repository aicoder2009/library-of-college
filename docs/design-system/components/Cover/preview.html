<!-- @dsCard height=300 -->
<link rel="stylesheet" href="../../tokens.css">
<style>
  #cover{position:relative;width:960px;height:300px;background:var(--bg);overflow:hidden}
  #cover svg{position:absolute;inset:0}
  .name{position:absolute;left:48px;bottom:74px;margin:0;width:440px;
    font-family:var(--font-serif);font-size:72px;font-weight:600;line-height:.92;
    letter-spacing:-.015em;color:var(--ink)}
  .tag{position:absolute;left:48px;bottom:44px;margin:0;width:440px;
    font-family:var(--font-sans);font-size:13.5px;line-height:1.5;color:var(--muted)}
  .c0{fill:var(--c0)} .c2{fill:var(--c2)} .c4{fill:var(--c4)} .c6{fill:var(--c6)}
  .hole{fill:var(--bg)} .rail{fill:var(--tagink)} .stroke{fill:var(--c5)}
</style>
<div id="cover">
  <!-- blocks: four luggage-tag slabs in c0, c2, c6, c4 — 60px tall (space-6 + space-8 minus gaps),
       460-500px wide, bleeding off the right edge; corners rx = radius-md 8px, notch = space-6 18px.
       arrangement: a strip of unequal staggered bands, left edges at 500/560/520/492, all right of x=480.
       pattern: the tag's punched hole repeated as a binder rail of 11 discs at space-7 26px pitch —
       chosen because the one non-rectangular shape this system owns is the luggage tag, and the hole
       is what makes it one; a generic warm-paper system would land on rules or dots, not a punch rail.
       scales: pitch space-7 26px, band gap space-5 14px, hole r 5px, corner radius-md 8px, notch space-6 18px. -->
  <svg viewBox="0 0 960 300" width="960" height="300" aria-hidden="true">
    <path class="c0" d="M518 20 L972 20 A8 8 0 0 1 980 28 L980 72 A8 8 0 0 1 972 80 L518 80 L500 50 Z"/>
    <circle class="hole" cx="528" cy="50" r="5"/>
    <path class="c2" d="M578 94 L972 94 A8 8 0 0 1 980 102 L980 146 A8 8 0 0 1 972 154 L578 154 L560 124 Z"/>
    <circle class="hole" cx="588" cy="124" r="5"/>
    <path class="c6" d="M538 168 L972 168 A8 8 0 0 1 980 176 L980 220 A8 8 0 0 1 972 228 L538 228 L520 198 Z"/>
    <circle class="hole" cx="548" cy="198" r="5"/>
    <path class="c4" d="M510 242 L972 242 A8 8 0 0 1 980 250 L980 294 A8 8 0 0 1 972 302 L510 302 L492 272 Z"/>
    <circle class="hole" cx="520" cy="272" r="5"/>
    <g class="rail">
      <circle cx="496" cy="24" r="3"/><circle cx="496" cy="50" r="3"/><circle cx="496" cy="76" r="3"/>
      <circle cx="496" cy="102" r="3"/><circle cx="496" cy="128" r="3"/><circle cx="496" cy="154" r="3"/>
      <circle cx="496" cy="180" r="3"/><circle cx="496" cy="206" r="3"/><circle cx="496" cy="232" r="3"/>
      <circle cx="496" cy="258" r="3"/><circle cx="496" cy="284" r="3"/>
    </g>
  </svg>
  <p class="name">Warm Paper</p>
  <p class="tag">The design language of Library of College: serif reading, hairline rules, and seven colors that each mean one thing.</p>
</div>

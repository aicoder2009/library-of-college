<!-- @dsCard group="Actions" height=140 subtitle="A text-first toggle" -->
<link rel="stylesheet" href="../../tokens.css">
<style>
  body{margin:0;padding:24px;background:var(--bg);color:var(--ink);
    font:15px/1.5 var(--font-sans);display:flex;flex-direction:column;gap:14px;align-items:flex-start}
  .switch{display:inline-flex;align-items:center;gap:7px;border:none;background:none;
    padding:2px 0;color:var(--muted);font-size:12.5px;font-weight:600;white-space:nowrap;
    font-family:inherit;cursor:pointer}
  .swtrack{width:26px;height:15px;border-radius:999px;border:1px solid var(--line);
    background:var(--wash);display:inline-flex;align-items:center;padding:1px;
    box-sizing:content-box}
  .swknob{width:11px;height:11px;border-radius:50%;background:var(--muted)}
  .switch[aria-checked="true"]{color:var(--ink)}
  .switch[aria-checked="true"] .swtrack{background:var(--ink);border-color:var(--ink)}
  .switch[aria-checked="true"] .swknob{transform:translateX(11px);background:var(--bg)}
  .hint{color:var(--faint);font-size:12px;margin:0}
</style>
<div id="root">
  <button class="switch" role="switch" aria-checked="true"><span class="swtrack"><span class="swknob"></span></span>✦ Breakdown</button>
  <button class="switch" role="switch" aria-checked="false"><span class="swtrack"><span class="swknob"></span></span>✦ Breakdown</button>
  <p class="hint">On by default. Off returns matches only, without the outline and gap analysis.</p>
</div>
